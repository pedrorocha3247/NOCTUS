<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NOCTUS — Sistema Integrado de Processos e Eficiência"
    />
    <title>NOCTUS</title>
    <script>
      /* tema escolhido em Configurações > Aparência; aplicado antes de desenhar a página */
      try { if (localStorage.getItem("noctus.tema") === "claro") document.documentElement.dataset.tema = "claro"; } catch (e) {}
      /* fundo do login acompanha o mouse (vale só onde existe .login) */
      (function(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;var r=document.documentElement,f=0,x=0,y=0;
      addEventListener("pointermove",function(e){x=e.clientX/innerWidth*2-1;y=e.clientY/innerHeight*2-1;if(!f)f=requestAnimationFrame(function(){f=0;r.style.setProperty("--mx",x.toFixed(3));r.style.setProperty("--my",y.toFixed(3))})},{passive:true})})();
    </script>
    <!-- Login novo (16/10/2026): cadastro com e-mail, "Esqueci a senha" e pedido
         único do e-mail para quem ainda não tem. Para voltar ao login antigo,
         basta apagar a linha abaixo. -->
    <script>window.NOCTUS_V2 = true;</script>
    <script src="./noctus-erros.js"></script>
    <script>
      /* Pedido do Rocha (21/10/2026): se a tela quebrar por um erro técnico (ou o
         sistema não carregar), mostra uma mensagem simples em vez de página em
         branco ou detalhe técnico. Só age com a área do sistema vazia. */
      (function(){var feito=0,montou=0;
      function falha(){var r=document.getElementById("root");if(feito||!r||r.childElementCount)return;feito=1;
      try{window.NoctusErros&&NoctusErros.registrar(new Error(montou?"a tela parou de funcionar":"o sistema n\u00e3o carregou"),"tela de falha exibida")}catch(x){}
      r.innerHTML='<div role="alert" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center;background:var(--color-bg,#0a0c10);color:var(--color-text,#f2f4f8);font-family:Inter,system-ui,sans-serif"><div style="max-width:28rem"><h2 style="margin:0 0 .6rem;font-size:1.25rem">N\u00e3o foi poss\u00edvel carregar esta tela</h2><p style="margin:0 0 1.2rem;opacity:.75;line-height:1.5">Falha de comunica\u00e7\u00e3o com o servidor. Recarregue a p\u00e1gina; se o problema continuar, contate o administrador.</p><button type="button" onclick="location.reload()" style="padding:.6rem 1.2rem;border:none;border-radius:10px;background:#1db06b;color:#fff;font:inherit;font-weight:600;cursor:pointer">Recarregar</button></div></div>';}
      function depois(){if(montou)setTimeout(falha,80)}
      addEventListener("error",depois);addEventListener("unhandledrejection",depois);
      addEventListener("DOMContentLoaded",function(){var r=document.getElementById("root");if(!r)return;
        new MutationObserver(function(){if(r.childElementCount)montou=1;else if(montou)setTimeout(falha,80)}).observe(r,{childList:true});});
      addEventListener("load",function(){setTimeout(function(){if(!montou)falha()},6000)});})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
